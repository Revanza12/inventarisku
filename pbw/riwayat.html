<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat - InventarisKu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .header {
            background-color: cadetblue;
            height: 65px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 15px 15px 0 0;
        }

        .header svg {
            width: 22px;
            height: 22px;
        }

        .header h2 {
            font-size: 20px;
        }

        .container {
            display: flex;
            min-height: calc(100vh - 65px);
        }

        .sidebar {
            width: 145px;
            flex-shrink: 0;
            padding: 25px 20px;
        }

        .sidebar h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #ddd;
        }

        .sidebar a {
            display: block;
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 13px;
            white-space: nowrap;
        }

        .sidebar a:hover,
        .sidebar a.active {
            color: cadetblue;
        }

        .logout {
            color: #ff7777 !important;
            margin-top: 25px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 10px;
        }

        .riwayat-container {
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 15px;
        }

        .riwayat-container h2 {
            font-size: 22px;
            margin-bottom: 19px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .search-box {
            flex: 1;
            min-width: 0;
        }

        .search-box input {
            width: 100%;
            padding: 14px 12px;
            background: transparent;
            border: 1px solid #333;
            border-radius: 11px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: cadetblue;
        }

        .search-box input::placeholder {
            color: #bbb;
        }

        .btn-bersihkan {
            background-color: transparent;
            border: 1px solid #ff7777;
            border-radius: 11px;
            padding: 0 15px;
            color: #ff7777;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-bersihkan:hover {
            background-color: #ff7777;
            color: black;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #292929;
            border-radius: 11px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 550px;
        }

        th {
            text-align: left;
            font-size: 12px;
            padding: 11px;
            border-bottom: 1px solid #292929;
            color: #ccc;
        }

        td {
            padding: 13px 11px;
            border-bottom: 1px solid #181818;
            font-size: 15px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #171717;
        }

        .status-selesai {
            color: #00d084;
            font-size: 12px;
            padding: 4px 8px;
            border: 1px solid #00d084;
            border-radius: 6px;
        }

        .empty {
            text-align: center;
            color: #aaa;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 120px;
                padding: 20px 10px;
            }

            .main-content {
                padding: 10px 5px;
            }

            .riwayat-container h2 {
                font-size: 19px;
            }

            .toolbar {
                flex-wrap: wrap;
            }

            .search-box {
                flex-basis: 100%;
            }

            .btn-bersihkan {
                padding: 12px;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="header">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 3 7v10l9 5 9-5V7l-9-5z"/>
            <path d="m3 7 9 5 9-5"/>
            <path d="M12 12v10"/>
        </svg>
        <h2>InventarisKu</h2>
    </div>

    <div class="container">
        <aside class="sidebar">
            <h3>MENU</h3>
            <a href="dashboard.html">▦ Dashboard</a>
            <a href="inventaris.html">▤ Inventaris</a>
            <a href="peminjaman.html">⇄ Peminjaman</a>
            <a href="riwayat.html" class="active">◷ Riwayat</a>
            <a href="#" class="logout" onclick="logout()">⇥ Logout</a>
        </aside>

        <main class="main-content">
            <div class="riwayat-container">
                <h2>Riwayat Peminjaman</h2>

                <div class="toolbar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="⌕ Cari riwayat..." oninput="tampilkanRiwayat()">
                    </div>
                    <button class="btn-bersihkan" onclick="hapusRiwayat()">Hapus Riwayat</button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Peminjam</th>
                                <th>Barang</th>
                                <th>Tgl Pinjam</th>
                                <th>Tgl Kembali</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tabelRiwayat"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        if (sessionStorage.getItem("login") !== "berhasil") {
            window.location.href = "login.html";
        }

        let riwayat = JSON.parse(localStorage.getItem("riwayat"));

        if (riwayat === null) {
            riwayat = [
                { peminjam: "Rina", barang: "Mikrofon", tglPinjam: "2026-02-15", tglKembali: "2026-02-18", status: "Selesai" },
                { peminjam: "Dedi", barang: "Speaker", tglPinjam: "2026-02-20", tglKembali: "2026-02-22", status: "Selesai" }
            ];
            simpanRiwayat();
        }

        function simpanRiwayat() {
            localStorage.setItem("riwayat", JSON.stringify(riwayat));
        }

        function tampilkanRiwayat() {
            let tabel = document.getElementById("tabelRiwayat");
            let pencarian = document.getElementById("searchInput").value.toLowerCase();
            tabel.innerHTML = "";

            let jumlah = 0;

            for (let i = 0; i < riwayat.length; i++) {
                let item = riwayat[i];
                if (!item.peminjam.toLowerCase().includes(pencarian) && !item.barang.toLowerCase().includes(pencarian)) {
                    continue;
                }

                jumlah++;
                let baris = document.createElement("tr");

                baris.innerHTML = `
                    <td>${item.peminjam}</td>
                    <td>${item.barang}</td>
                    <td>${item.tglPinjam}</td>
                    <td>${item.tglKembali}</td>
                    <td><span class="status-selesai">${item.status}</span></td>
                `;

                tabel.appendChild(baris);
            }

            if (jumlah === 0) {
                tabel.innerHTML = `<tr><td colspan="5" class="empty">Tidak ada riwayat peminjaman</td></tr>`;
            }
        }

        function hapusRiwayat() {
            if (riwayat.length === 0) {
                alert("Riwayat sudah kosong!");
                return;
            }

            let konfirmasi = confirm("Apakah Anda yakin ingin menghapus seluruh riwayat?");
            if (konfirmasi) {
                riwayat = [];
                simpanRiwayat();
                tampilkanRiwayat();
                alert("Riwayat berhasil dibersihkan!");
            }
        }

        function logout() {
            sessionStorage.removeItem("login");
            sessionStorage.removeItem("username");
            window.location.href = "login.html";
        }

        tampilkanRiwayat();
    </script>
</body>
</html>
