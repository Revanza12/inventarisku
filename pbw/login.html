
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            min-height: 100vh;
            color: white;
        }

        /* HEADER */
        .header {
            background-color: cadetblue;
            margin: 20px;
            padding: 16px;
            height: 145px;
            border-radius: 10px;
            text-align: center;
        }

        .header svg {
            width: 30px;
            height: 30px;
            margin-bottom: 13px;
        }

        .header h2 {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .header p {
            font-size: 15px;
            color: aliceblue;
        }

        /* LOGIN CONTAINER */
        .login-container {
            width: 425px;
            max-width: calc(100% - 30px);
            margin: -4px auto 30px;
            padding: 25px 20px 20px;
            border: 1px solid #292929;
            border-radius: 15px;
        }

        .login-container h2 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 23px;
        }

        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 20px;
            font-size: 16px;
        }

        /* FORM GROUP */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            font-size: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 17px 15px;
            background-color: transparent;
            border: 1px solid #333;
            border-radius: 11px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: cadetblue;
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        /* BUTTON */
        .btn-login {
            width: 100%;
            padding: 20px;
            background-color: darkcyan;
            border: none;
            border-radius: 11px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-login:hover {
            background-color: cadetblue;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            margin-top: 17px;
            color: gainsboro;
            font-size: 14px;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .header {
                margin: 12px;
            }

            .login-container {
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="white"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

            <path d="M12 2 3 7v10l9 5 9-5V7l-9-5z"/>
            <path d="m3 7 9 5 9-5"/>
            <path d="M12 12v10"/>

        </svg>

        <h2>InventarisKu</h2>
        <p>Sistem Peminjaman Inventaris</p>

    </div>

    <!-- LOGIN CONTAINER -->
    <div class="login-container">

        <h2>Selamat Datang</h2>

        <p class="subtitle">
            Silakan masuk ke akun Anda
        </p>

        <!-- FORM LOGIN -->
        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username / Email</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username atau email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                Masuk
            </button>

        </form>

        <!-- FOOTER -->
        <div class="footer">
            Hubungi administrator jika lupa password
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>

        document.getElementById("loginForm").addEventListener("submit", function(e) {

            e.preventDefault();

            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;

            if (username.trim() !== "" && password.trim() !== "") {

                sessionStorage.setItem("login", "berhasil");
                sessionStorage.setItem("username", username);

                window.location.href = "dashboard.html";

            }

        });

    </script>

</body>
</html>
