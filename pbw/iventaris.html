
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventaris - InventarisKu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }


        .header {
            background-color: cadetblue;
            height: 65px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 15px 15px 0 0;
        }

        .header svg {
            width: 22px;
            height: 22px;
        }

        .header h2 {
            font-size: 20px;
        }


        .container {
            display: flex;
            min-height: calc(100vh - 65px);
        }


        .sidebar {
            width: 145px;
            flex-shrink: 0;
            padding: 25px 20px;
        }

        .sidebar h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #ddd;
        }

        .sidebar a {
            display: block;
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 13px;
            white-space: nowrap;
        }

        .sidebar a:hover,
        .sidebar a.active {
            color: #5bc0de;
        }

        .logout {
            color: #ff7777 !important;
            margin-top: 25px;
        }


        .main-content {
            flex: 1;
            min-width: 0;
            padding: 10px;
        }


        .inventory-container {
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 10px;
        }

        .inventory-container h2 {
            font-size: 22px;
            margin-bottom: 19px;
        }

        /* SEARCH DAN TAMBAH */
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .search-box {
            flex: 1;
            min-width: 0;
        }

        .search-box input {
            width: 100%;
            padding: 14px 12px;
            background: transparent;
            border: 1px solid #333;
            border-radius: 11px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: cadetblue;
        }

        .search-box input::placeholder {
            color: #bbb;
        }

        .btn-tambah {
            background-color: #287bbd;
            border: none;
            border-radius: 11px;
            padding: 0 15px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-tambah:hover {
            background-color: cadetblue;
        }

        /* TABEL */
        .table-container {
            width: 100%;
            overflow-x: auto;
            border: 1px solid #292929;
            border-radius: 11px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 400px;
        }

        th {
            text-align: left;
            font-size: 12px;
            padding: 11px 0;
            border-bottom: 1px solid #292929;
        }

        td {
            padding: 13px 0;
            border-bottom: 1px solid #181818;
            font-size: 16px;
        }

        th:first-child,
        td:first-child {
            padding-left: 0;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover {
            background-color: #171717;
        }

        tbody tr.selected {
            background-color: cadetblue;
        }

        .status {
            font-size: 12px;
        }

        .tersedia {
            color: #00d084;
        }

        .dipinjam {
            color: orange;
        }

        /* TOMBOL EDIT DAN HAPUS */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .action-buttons button {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: 1px solid #292929;
            border-radius: 11px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .action-buttons button:hover {
            background-color: #193d59;
        }

        .empty {
            text-align: center;
            color: #aaa;
            padding: 20px;
        }

        @media (max-width: 600px) {

            .sidebar {
                width: 120px;
                padding: 20px 10px;
            }

            .main-content {
                padding: 10px 5px;
            }

            .inventory-container h2 {
                font-size: 19px;
            }

            .toolbar {
                flex-wrap: wrap;
            }

            .search-box {
                flex-basis: 100%;
            }

            .btn-tambah {
                padding: 12px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>


    <div class="header">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="white"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round">

            <path d="M12 2 3 7v10l9 5 9-5V7l-9-5z"/>
            <path d="m3 7 9 5 9-5"/>
            <path d="M12 12v10"/>

        </svg>

        <h2>InventarisKu</h2>

    </div>


    <div class="container">


        <aside class="sidebar">

            <h3>MENU</h3>

            <a href="dashboard.html">
                ▦ Dashboard
            </a>

            <a href="inventaris.html" class="active">
                ▤ Inventaris
            </a>

            <a href="peminjaman.html">
                ⇄ Peminjaman
            </a>

            <a href="riwayat.html">
                ◷ Riwayat
            </a>

            <a href="#" class="logout" onclick="logout()">
                ⇥ Logout
            </a>

        </aside>

        <main class="main-content">

            <div class="inventory-container">

                <h2>Data Inventaris</h2>

                <!-- SEARCH DAN TAMBAH -->
                <div class="toolbar">

                    <div class="search-box">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="⌕ Cari nama barang..."
                            oninput="tampilkanData()"
                        >
                    </div>

                    <button class="btn-tambah" onclick="tambahData()">
                        + Tambah
                    </button>

                </div>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Barang</th>
                                <th>Kode</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody id="tabelInventaris">
                        </tbody>

                    </table>

                </div>

                <div class="action-buttons">

                    <button onclick="editData()">
                        Edit data
                    </button>

                    <button onclick="hapusData()">
                        Hapus data
                    </button>

                </div>

            </div>

        </main>

    </div>

    <script>

        if (sessionStorage.getItem("login") !== "berhasil") {
            window.location.href = "login.html";
        }

        let inventaris = JSON.parse(localStorage.getItem("inventaris"));

        if (inventaris === null) {

            inventaris = [
                {
                    nama: "Laptop",
                    kode: "INV-001",
                    status: "Tersedia"
                },
                {
                    nama: "Proyektor",
                    kode: "INV-002",
                    status: "Dipinjam"
                },
                {
                    nama: "Kamera",
                    kode: "INV-003",
                    status: "Tersedia"
                }
            ];

            simpanData();
        }

        function simpanData() {
            localStorage.setItem(
                "inventaris",
                JSON.stringify(inventaris)
            );
        }


        let indexDipilih = -1;


        function tampilkanData() {

            let tabel = document.getElementById("tabelInventaris");
            let pencarian = document.getElementById("searchInput").value.toLowerCase();

            tabel.innerHTML = "";

            let jumlah = 0;

            for (let i = 0; i < inventaris.length; i++) {

                if (!inventaris[i].nama.toLowerCase().includes(pencarian)) {
                    continue;
                }

                jumlah++;

                let baris = document.createElement("tr");

                if (indexDipilih === i) {
                    baris.classList.add("selected");
                }

                let kolomNama = document.createElement("td");
                kolomNama.textContent = inventaris[i].nama;

                let kolomKode = document.createElement("td");
                kolomKode.textContent = inventaris[i].kode;

                let kolomStatus = document.createElement("td");

                let status = document.createElement("span");
                status.textContent = inventaris[i].status;
                status.className = "status " +
                    (inventaris[i].status === "Tersedia"
                    ? "tersedia" : "dipinjam");

                kolomStatus.appendChild(status);

                baris.appendChild(kolomNama);
                baris.appendChild(kolomKode);
                baris.appendChild(kolomStatus);

                baris.onclick = function() {
                    indexDipilih = i;
                    tampilkanData();
                };

                tabel.appendChild(baris);
            }

            if (jumlah === 0) {

                let baris = document.createElement("tr");
                let kolom = document.createElement("td");

                kolom.colSpan = 3;
                kolom.className = "empty";
                kolom.textContent = "Data tidak ditemukan";

                baris.appendChild(kolom);
                tabel.appendChild(baris);

            }
        }

        function tambahData() {

            let nama = prompt("Masukkan nama barang:");

            if (nama === null || nama.trim() === "") {
                return;
            }

            let kode = prompt("Masukkan kode barang:");

            if (kode === null || kode.trim() === "") {
                return;
            }

            let status = prompt(
                "Masukkan status barang:\n1. Tersedia\n2. Dipinjam",
                "Tersedia"
            );

            if (status === null) {
                return;
            }

            status = status.trim().toLowerCase();

            if (status === "tersedia" || status === "1") {
                status = "Tersedia";
            } 
            else if (status === "dipinjam" || status === "2") {
                status = "Dipinjam";
            } 
            else {
                alert("Status tidak valid!");
                return;
            }

            let kodeAda = inventaris.some(function(item) {
                return item.kode.toLowerCase() === kode.trim().toLowerCase();
            });

            if (kodeAda) {
                alert("Kode barang sudah digunakan!");
                return;
            }

            inventaris.push({
                nama: nama.trim(),
                kode: kode.trim(),
                status: status
            });

            simpanData();
            tampilkanData();

            alert("Barang berhasil ditambahkan!");
        }

        // EDIT DATA
        function editData() {

            if (indexDipilih === -1) {
                alert("Pilih barang yang ingin diedit terlebih dahulu!");
                return;
            }

            let barang = inventaris[indexDipilih];

            let namaBaru = prompt(
                "Masukkan nama barang baru:",
                barang.nama
            );

            if (namaBaru === null || namaBaru.trim() === "") {
                return;
            }

            let kodeBaru = prompt(
                "Masukkan kode barang baru:",
                barang.kode
            );

            if (kodeBaru === null || kodeBaru.trim() === "") {
                return;
            }

            let kodeAda = inventaris.some(function(item, i) {
                return i !== indexDipilih &&
                    item.kode.toLowerCase() === kodeBaru.trim().toLowerCase();
            });

            if (kodeAda) {
                alert("Kode barang sudah digunakan!");
                return;
            }

            let statusBaru = prompt(
                "Masukkan status barang:\n1. Tersedia\n2. Dipinjam",
                barang.status
            );

            if (statusBaru === null) {
                return;
            }

            statusBaru = statusBaru.trim().toLowerCase();

            if (statusBaru === "tersedia" || statusBaru === "1") {
                statusBaru = "Tersedia";
            }
            else if (statusBaru === "dipinjam" || statusBaru === "2") {
                statusBaru = "Dipinjam";
            }
            else {
                alert("Status tidak valid!");
                return;
            }

            inventaris[indexDipilih] = {
                nama: namaBaru.trim(),
                kode: kodeBaru.trim(),
                status: statusBaru
            };

            simpanData();

            indexDipilih = -1;

            tampilkanData();

            alert("Data berhasil diperbarui!");
        }

        function hapusData() {

            if (indexDipilih === -1) {
                alert("Pilih barang yang ingin dihapus terlebih dahulu!");
                return;
            }

            let konfirmasi = confirm(
                "Apakah Anda yakin ingin menghapus barang " +
                inventaris[indexDipilih].nama + "?"
            );

            if (konfirmasi) {

                inventaris.splice(indexDipilih, 1);

                indexDipilih = -1;

                simpanData();
                tampilkanData();

                alert("Data berhasil dihapus!");

            }
        }

        function logout() {

            sessionStorage.removeItem("login");
            sessionStorage.removeItem("username");

            window.location.href = "login.html";

        }

        tampilkanData();

    </script>

</body>
</html>
